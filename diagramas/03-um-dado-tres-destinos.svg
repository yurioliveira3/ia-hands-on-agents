<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title>Um dado, três destinos: filesystem, sqlite e fetch via MCP</title>

  <defs>
    <marker id="seta2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A5A3F5"/>
    </marker>
    <marker id="seta2d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8F8FFF"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="600" fill="#16171B" stroke="#3F3F46" stroke-width="2"/>
  <text x="52" y="52" font-size="20" font-weight="bold" letter-spacing="1" fill="#8F8FFF">UM DADO, TRÊS DESTINOS · DEMO 2</text>
  <rect x="700" y="70" width="380" height="32" fill="#0B1220" stroke="#8F8FFF" stroke-width="1"/>
  <text x="890" y="91" font-size="13" font-weight="bold" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">CLI DO AGENTE · CLAUDE CODE · OPENCODE</text>

  <rect x="60" y="240" width="250" height="80" fill="#3D9E90" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="185" y="272" font-size="15" font-weight="bold" fill="#101F1C" text-anchor="middle">USER</text>
  <text x="185" y="298" font-size="14" fill="#101F1C" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">em linguagem natural</text>

  <rect x="430" y="240" width="280" height="80" fill="#232329" stroke="#C9C5C0" stroke-width="1.5"/>
  <text x="570" y="272" font-size="15" font-weight="bold" fill="#E4E4E7" text-anchor="middle">A CLI DO AGENTE</text>
  <text x="570" y="298" font-size="14" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">com o catálogo MCP conectado</text>

  <rect x="880" y="120" width="270" height="74" fill="#2B2B33" stroke="#8F8FFF" stroke-width="1.2"/>
  <text x="1015" y="148" font-size="14" font-weight="bold" fill="#E4E4E7" text-anchor="middle">filesystem</text>
  <text x="1015" y="172" font-size="13" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">escreve e lê o resumo.md</text>

  <rect x="880" y="248" width="270" height="74" fill="#2B2B33" stroke="#8F8FFF" stroke-width="1.2"/>
  <text x="1015" y="276" font-size="14" font-weight="bold" fill="#E4E4E7" text-anchor="middle">sqlite</text>
  <text x="1015" y="300" font-size="13" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">cria e lê a tabela top3</text>

  <rect x="880" y="406" width="270" height="74" fill="#2B2B33" stroke="#8F8FFF" stroke-width="1.2"/>
  <text x="1015" y="434" font-size="14" font-weight="bold" fill="#E4E4E7" text-anchor="middle">fetch</text>
  <text x="1015" y="458" font-size="13" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">busca um dado externo na rede</text>

  <path d="M 310 280 L 426 280" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#seta2)" fill="none"/>

  <path d="M 716 262 L 770 262 L 770 157 L 876 157" stroke="#A5A3F5" stroke-width="1.4" marker-end="url(#seta2)" fill="none"/>
  <path d="M 716 280 L 876 280" stroke="#A5A3F5" stroke-width="1.4" marker-end="url(#seta2)" fill="none"/>
  <path d="M 716 298 L 770 298 L 770 443 L 876 443" stroke="#A5A3F5" stroke-width="1.4" marker-end="url(#seta2)" fill="none"/>

  <path d="M 876 172 L 750 172 L 750 214 L 720 214" stroke="#8F8FFF" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#seta2d)" fill="none"/>
  <path d="M 876 306 L 750 306 L 750 214 L 720 214" stroke="#8F8FFF" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#seta2d)" fill="none"/>
  <path d="M 876 464 L 750 464 L 750 214 L 720 214" stroke="#8F8FFF" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#seta2d)" fill="none"/>
  <text x="744" y="205" font-size="13" fill="#A5A3F5" font-weight="bold" text-anchor="end" font-family="Arial, Helvetica, sans-serif">lê de volta</text>

  <text x="185" y="580" font-size="15" startOffset="0" fill="#E4E4E7" font-family="Arial, Helvetica, sans-serif">o agente escreve, grava e busca - e depois lê o que ele mesmo criou</text>
  <text x="185" y="604" font-size="13" fill="#A1A1AA" font-family="Arial, Helvetica, sans-serif">configuração no .mcp.json; sem SDK à mão, sem autenticação extra</text>
</svg>
