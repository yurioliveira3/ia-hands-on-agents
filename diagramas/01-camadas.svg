  <text x="856" y="418" font-size="15" fill="#101F1C" text-anchor="end">zero-shot · few-shot · temperature</text>

  <text x="1148" y="586" font-size="15" fill="#A1A1AA" text-anchor="end">eval-driven development (bônus) · repetibilidade · custo</text>
