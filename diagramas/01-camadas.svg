<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title>Mapa de camadas: Engenharia de contexto dentro do laço, do catálogo MCP e da armação do agente</title>

  <rect x="20" y="20" width="1160" height="580" fill="#16171B" stroke="#3F3F46" stroke-width="2"/>
  <text x="52" y="52" font-size="20" font-weight="bold" letter-spacing="1" fill="#8F8FFF">SISTEMA DE ENTREGA COM LLM</text>

  <rect x="52" y="68" width="1096" height="486" fill="#232329" stroke="#C9C5C0" stroke-width="1.5"/>
  <text x="76" y="100" font-size="16" font-weight="bold" letter-spacing="1" fill="#E4E4E7">ARMAÇÃO DO AGENTE (HARNESS)</text>
  <rect x="690" y="84" width="430" height="36" fill="#0B1220" stroke="#8F8FFF" stroke-width="1"/>
  <text x="905" y="107" font-size="14" font-weight="bold" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">CLAUDE CODE · OPENCODE</text>
  <text x="1100" y="546" font-size="15" fill="#E4E4E7" text-anchor="end">permissões · segredos (.env) · executores</text>

