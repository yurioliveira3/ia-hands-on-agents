  <text x="1012" y="510" font-size="15" fill="#E4E4E7" text-anchor="end">catálogo padrão (MCP) · filesystem · sqlite · fetch</text>

  <rect x="232" y="200" width="736" height="276" fill="#232329" stroke="#C9C5C0" stroke-width="1.2"/>
  <text x="256" y="232" font-size="15" font-weight="bold" letter-spacing="1" fill="#E4E4E7">LAÇO DO AGENTE · CAMADA 3</text>
  <text x="924" y="462" font-size="15" fill="#E4E4E7" text-anchor="end">decidir · agir · observar · responder (run_agent à mão)</text>

  <rect x="324" y="264" width="552" height="172" fill="#3D9E90" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="348" y="296" font-size="15" font-weight="bold" letter-spacing="1" fill="#101F1C">ENGENHARIA DE CONTEXTO · CAMADAS 1 E 2</text>
  <rect x="368" y="312" width="330" height="32" fill="#8F8FFF"/>
