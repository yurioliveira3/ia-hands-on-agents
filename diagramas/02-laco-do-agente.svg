<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title>Laço do agente: decidir, agir, observar, responder</title>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C9C5C0"/>
    </marker>
    <marker id="setai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A5A3F5"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1160" height="740" fill="#16171B" stroke="#3F3F46" stroke-width="2"/>
  <text x="52" y="52" font-size="20" font-weight="bold" letter-spacing="1" fill="#8F8FFF">LAÇO DO AGENTE · CAMADA 3</text>
  <rect x="700" y="70" width="380" height="32" fill="#0B1220" stroke="#8F8FFF" stroke-width="1"/>
  <text x="890" y="91" font-size="13" font-weight="bold" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">SEM FRAMEWORK · MAX_STEPS = 6</text>

  <rect x="500" y="62" width="170" height="44" fill="#232329" stroke="#C9C5C0" stroke-width="1.2"/>
  <text x="585" y="90" font-size="15" fill="#E4E4E7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">resposta final</text>

  <rect x="90" y="150" width="180" height="52" fill="#3D9E90" stroke="#2DD4BF" stroke-width="1.2"/>
  <text x="180" y="172" font-size="14" font-weight="bold" fill="#101F1C" text-anchor="middle">USER</text>
  <text x="180" y="194" font-size="13" fill="#101F1C" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">faz a pergunta</text>

  <path d="M 270 176 L 376 176" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#seta)" fill="none"/>

  <rect x="380" y="150" width="410" height="52" fill="#232329" stroke="#C9C5C0" stroke-width="1.2"/>
  <text x="585" y="182" font-size="15" fill="#E4E4E7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">LLM responde um JSON de ação</text>

  <path d="M 585 150 L 585 108" stroke="#A5A3F5" stroke-width="1.4" marker-end="url(#setai)" fill="none"/>
  <text x="600" y="134" font-size="13" fill="#A5A3F5" font-weight="bold">answer</text>

  <path d="M 585 202 L 585 266" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#seta)" fill="none"/>
  <text x="600" y="242" font-size="13" fill="#E4E4E7" font-family="Arial, Helvetica, sans-serif">tool + args</text>

  <rect x="330" y="270" width="510" height="46" fill="#2B2B33" stroke="#8F8FFF" stroke-width="1.2"/>
  <text x="585" y="299" font-size="15" fill="#E4E4E7" text-anchor="middle">QUAL FERRAMENTA?</text>

  <rect x="90" y="400" width="290" height="74" fill="#232329" stroke="#C9C5C0" stroke-width="1.2"/>
  <text x="235" y="428" font-size="14" font-weight="bold" fill="#E4E4E7" text-anchor="middle">load_csv</text>
  <text x="235" y="452" font-size="13" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">lê a base e mostra a amostra</text>

  <rect x="440" y="400" width="290" height="74" fill="#232329" stroke="#C9C5C0" stroke-width="1.2"/>
  <text x="585" y="428" font-size="14" font-weight="bold" fill="#E4E4E7" text-anchor="middle">exec_python</text>
  <text x="585" y="452" font-size="13" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">roda pandas e devolve o print</text>

  <rect x="790" y="400" width="290" height="74" fill="#232329" stroke="#C9C5C0" stroke-width="1.2"/>
  <text x="935" y="428" font-size="14" font-weight="bold" fill="#E4E4E7" text-anchor="middle">wiki_busca</text>
  <text x="935" y="452" font-size="13" fill="#A1A1AA" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">consulta a Wikipedia</text>

  <path d="M 500 316 L 235 396" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#seta)" fill="none"/>
  <path d="M 585 316 L 585 396" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#seta)" fill="none"/>
  <path d="M 670 316 L 935 396" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#seta)" fill="none"/>

  <rect x="380" y="540" width="410" height="52" fill="#232329" stroke="#C9C5C0" stroke-width="1.2"/>
  <text x="585" y="572" font-size="15" fill="#E4E4E7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">resultado volta como mensagem</text>

  <path d="M 235 474 L 520 540" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#seta)" fill="none"/>
  <path d="M 585 474 L 585 536" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#seta)" fill="none"/>
  <path d="M 935 474 L 650 540" stroke="#C9C5C0" stroke-width="1.4" marker-end="url(#seta)" fill="none"/>

  <path d="M 796 566 L 845 566 L 845 176 L 796 176" stroke="#8F8FFF" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#setai)" fill="none"/>
  <text x="858" y="306" font-size="14" fill="#A5A3F5" font-weight="bold">repete</text>

  <text x="585" y="668" font-size="15" fill="#E4E4E7" text-anchor="end" font-family="Arial, Helvetica, sans-serif">decidir · agir · observar · decidir de novo até o answer</text>
  <text x="585" y="694" font-size="13" fill="#A1A1AA" text-anchor="end" font-family="Arial, Helvetica, sans-serif">freio: max_steps = 6 devolve '(limite de passos atingido)'</text>
</svg>
